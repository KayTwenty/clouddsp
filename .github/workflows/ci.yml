name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # typegen creates Next's route types (RouteContext, LayoutProps), which
      # otherwise only exist after `next dev` or `next build`.
      - run: npm run typecheck
      - run: npm run build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Syntax check only: installing PyTorch on CI isn't worth the minutes.
      - run: python -m compileall -q worker/clouddsp_worker worker/start.py
      - run: python worker/start.py --dry-run
